<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>

    <link rel="stylesheet" href="CSS/memory.css">
</head>

<body>
    <main>
        <div id="headerFront"></div>
        <h1>Memory</h1>
        <div id="buttonToMemory">

            <div class="cardSize" id="pig">
                <div class="picSize">
                    <img class="cardPicture" src="Bilder/greta/family.jpeg" alt="Greta Gris">
                </div>
                <div class="textToMemoryButtons">Greta Gris</div>
            </div>

            <div class="cardSize">
                <div class="picSize" id="paw">
                    <img class="cardPicture" src="Bilder/paw/pawpatrol.jpg" alt="paw">
                </div>
                <div class="textToMemoryButtons">Paw Patrol</div>
            </div>

            <div class="cardSize">
                <div class="picSize" id="spidy">
                    <img class="cardPicture" src="Bilder/spidy/spidy3.jpg" alt="Spidy">
                </div>
                <div class="textToMemoryButtons">Spidy & hans fantastiska vänner</div>
            </div>

            <div class="cardSize">
                <div class="picSize" id="pettson">
                    <img class="cardPicture" src="Bilder/pettson/pettson4.jpg" alt="pettson och findus">
                </div>
                <div class="textToMemoryButtons">Pettson & Findus</div>
            </div>

            <div class="cardSize">
                <div class="picSize" id="bluey">
                    <img class="cardPicture" src="Bilder/bluey/family.jpg" alt="Bluey">
                </div>
                <div class="textToMemoryButtons">Bluey</div>
            </div>
        </div>

        <div id="numbers">
            <div class="button" id="pairFour"> 4 par</div>
            <div class="button" id="pairSix"> 6 par</div>
            <div class="button" id="pairEight"> 8 par</div>
        </div>

        <div id="memoryWrapper">
            <div id="newGame" class="button">Nytt spel</div>
            <div id="memoryContainer"></div>
        </div>

        <script src="Javascript/memory.js" defer></script>
    </main>
</body>

<footer>

</footer>

</html>
